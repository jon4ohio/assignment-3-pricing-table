<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
   <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pricing-table">
        <div class="pricing-card">
            <h2>Basic</h2>
            <p class="price">$10/month</p>
            <ul class="features">
                <li>5 Projects</li>
                <li>10GB Storage</li>
                <li>Email Support</li>
            </ul>
            <a href="#" class="btn" data-plan="Basic">Choose Plan</a>
        </div>
        <div class="pricing-card popular selected">
            <span class="popular-badge">Most Popular</span>
            <h2>Pro</h2>
            <p class="price">$20/month</p>
            <ul class="features">
                <li>50 Projects</li>
                <li>100GB Storage</li>
                <li>Priority Support</li>
            </ul>
            <a href="#" class="btn" data-plan="Pro">Choose Plan</a>
        </div>
        <div class="pricing-card">
            <h2>Enterprise</h2>
            <p class="price">$50/month</p>
            <ul class="features">
                <li>Unlimited Projects</li>
                <li>1TB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <a href="#" class="btn" data-plan="Enterprise">Choose Plan</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
